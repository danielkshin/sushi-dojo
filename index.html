<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Sushi Dojo</title>
    <link rel="icon" href="TemplateData/favicon.ico?v=sushi">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="preview">
      <div id="preview-stage">
        <img src="TemplateData/preview.png" alt="SushiDojo">
        <button id="play-button" type="button">PLAY</button>
      </div>
      <p class="credits">Created by <a href="https://seohyeon-min.github.io/my_portfolio/" target="_blank" rel="noopener">Seohyeon Min</a>, <a href="https://github.com/BaLancelot" target="_blank" rel="noopener">Lance Atienza</a>, and <a href="http://danielkshin.github.io/" target="_blank" rel="noopener">Daniel Shin</a> for <a href="https://dh26.dubhacks.co/" target="_blank" rel="noopener">DubHacks '26</a></p>
    </div>
    <div id="unity-container" class="unity-desktop is-hidden">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <p class="credits">Created by <a href="https://seohyeon-min.github.io/my_portfolio/" target="_blank" rel="noopener">Seohyeon Min</a>, <a href="https://github.com/BaLancelot" target="_blank" rel="noopener">Lance Atienza</a>, and <a href="http://danielkshin.github.io/" target="_blank" rel="noopener">Daniel Shin</a> for <a href="https://dh26.dubhacks.co/" target="_blank" rel="noopener">DubHacks '26</a></p>
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button">FULLSCREEN</div>
        <div id="unity-build-title">SushiDojo</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build.data",
        frameworkUrl: buildUrl + "/build.framework.js",
        codeUrl: buildUrl + "/build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TeamKorea",
        productName: "SushiDojo",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile is-hidden";
        document.body.classList.add("unity-mobile");
        canvas.className = "unity-mobile";


      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.querySelector("#play-button").onclick = () => {
        document.body.classList.add("playing");
        document.querySelector("#preview").style.display = "none";
        document.querySelector("#unity-container").classList.remove("is-hidden");
        document.querySelector("#unity-loading-bar").style.display = "block";
        document.body.appendChild(script);
      };

    </script>
  </body>
</html>
